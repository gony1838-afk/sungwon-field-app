<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1649a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="성원 작업일보">
  <title>성원 현장 입력</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span>SUNG WON</span></div>
        <h1>현장 입력</h1>
        <p>작업일보</p>
      </div>
      <nav class="nav">
        <button class="active" type="button" data-tab="daily" data-i18n="dailyTab">작업일보</button>
        <a href="/admin.html">관리자 취합</a>
      </nav>
      <p class="side-note">작업자는 휴대폰에서 작업일보를 저장하고, 관리자는 관리자 화면에서 취합/다운로드/인쇄합니다.</p>
    </aside>

    <main>
      <section class="toolbar">
        <div>
          <h2 id="screenTitle">작업일보 입력</h2>
          <p id="saveState" class="status">저장 대기 중</p>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="langKo">한국어</button>
          <button class="btn" type="button" id="langVi">Tiếng Việt</button>
          <button class="btn" type="button" id="addDailyRow">작업 행 추가</button>
          <button class="btn primary" type="button" id="saveDaily">작업일보 저장</button>
        </div>
      </section>

      <section class="tab-panel active" id="dailyPanel">
        <div class="panel">
          <div class="grid">
            <label class="field"><span data-i18n="productionDate">생산일자</span><input id="productionDate" type="date" required></label>
            <label class="field"><span data-i18n="writer">작성자</span><input id="dailyWriter" required></label>
            <label class="field"><span data-i18n="line">라인</span><input id="dailyLine" required></label>
            <label class="field"><span data-i18n="lineType">라인구분</span><select id="lineType" required><option value="cncManual">CNC 수동</option><option value="cncAuto">CNC 자동</option><option value="MCT">MCT</option></select></label>
            <label class="field" id="mctBedField"><span data-i18n="mctBedCount">MCT 베드 수</span><select id="mctBedCount"><option value="1">1베드</option><option value="2">2베드</option></select></label>
            <label class="field"><span data-i18n="shift">주야</span><select id="dailyShift" required><option value="주간">주간</option><option value="야간">야간</option></select></label>
          </div>
        </div>
        <div class="panel">
          <div class="row-list" id="dailyRows"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/pwa.js"></script>
  <script src="/app.js"></script>
</body>
</html>
