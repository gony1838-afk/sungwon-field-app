<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1649a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="성원 관리자">
  <title>성원 관리자 로그인</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span>SUNG WON</span></div>
        <h1>관리자 로그인</h1>
        <p>작업일보 · 불량일보 · ERP</p>
      </div>
      <nav class="nav">
        <a href="/">작업자 입력</a>
        <a class="active" href="/admin.html">관리자 취합</a>
      </nav>
      <p class="side-note">관리자 비밀번호 확인 후 취합 화면으로 이동합니다.</p>
    </aside>

    <main>
      <section class="admin-lock">
        <div class="lock-box">
          <h2>관리자 비밀번호</h2>
          <p>취합 화면은 관리자만 접근할 수 있습니다.</p>
          <label class="field">비밀번호<input id="adminPassword" type="password" autocomplete="current-password" autofocus></label>
          <button class="btn primary" id="adminLogin" type="button">접속</button>
          <p id="loginStatus" class="status"></p>
        </div>
      </section>
    </main>
  </div>
  <script src="/pwa.js"></script>
  <script src="/admin-login.js"></script>
</body>
</html>
